<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Démonstration clickjacking — Atelier Rita</title>
<style>
  :root {
    --demo: #b0251c;
    --accent: #111111; /* black: the frame's random colour can't be read cross-origin, so we don't try to match it */
    --panel: #ffffff;
    --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: var(--font); background: #000; }

  /* Full-bleed framed real site. No page scroll, so no white space below. */
  iframe#target { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Small fixed demonstration marker (always visible, cannot be scrolled away). */
  .demo-mark {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10000; pointer-events: none;
    background: var(--demo); color: #fff; font-family: var(--font);
    font-size: 12px; font-weight: 700; letter-spacing: .4px;
    padding: 6px 14px; border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.35);
    white-space: nowrap;
  }

  /* Panel styled like the site's News panel, placed at a random spot by script. */
  .popup {
    position: fixed; z-index: 30; width: 460px; max-width: calc(100vw - 24px);
    background: var(--panel); box-shadow: 0 18px 50px rgba(0,0,0,.22);
    color: var(--accent); font-family: var(--font);
  }
  .popup[hidden] { display: none; }
  .popup .body { padding: 32px 40px 26px; text-align: center; color: var(--accent); }
  .popup .label { font-size: 22px; font-weight: 600; letter-spacing: 0; }
  .popup .lead {
    margin: 20px 0 0; font-size: 23px; line-height: 1.2; font-weight: 500;
    letter-spacing: -.2px;
  }
  .popup .sub {
    display: block; width: 100%; margin: 28px 0 0; padding: 0;
    background: none; border: 0; cursor: pointer; color: var(--accent);
    font-family: var(--font); font-size: 20px; font-weight: 600; letter-spacing: 0;
  }
  /* letter icon sits where a close button would be; there is no close (scam funnels the click) */
  .popup .icon-btn {
    display: block; margin: 24px auto 2px; padding: 0;
    background: none; border: 0; cursor: pointer; color: var(--accent);
  }
  .popup .icon { display: block; width: 46px; height: 46px; }
</style>
</head>
<body>
  <iframe id="target" src="https://www.atelierrita.org" title="Site Atelier Rita chargé en iframe (démonstration)"></iframe>

  <div class="demo-mark">⚠ Démonstration - pas le vrai site d'Atelier Rita</div>

  <div class="popup" id="popup" hidden>
    <div class="body">
      <div class="label">Newsletter</div>
      <p class="lead">Inscrivez-vous à notre newsletter pour suivre les projets de l'atelier.</p>
      <button type="button" class="sub" id="subBtn">S'abonner à la newsletter</button>
      <button type="button" class="icon-btn" id="iconBtn" aria-label="S'abonner à la newsletter">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="2.5" y="5" width="19" height="14" rx="1.5" />
          <path d="M3 6.5l9 6 9-6" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    // The button collects nothing; it only redirects to a harmless link, to
    // illustrate that a convincing popup over a framed site can send a visitor anywhere.
    var YT = "https://www.youtube.com/watch?v=ciqHrJeInBQ";
    var popup = document.getElementById("popup");

    function place() {
      var pad = 12;
      var w = popup.offsetWidth, h = popup.offsetHeight;
      var maxX = Math.max(pad, window.innerWidth - w - pad);
      var maxY = Math.max(pad, window.innerHeight - h - pad);
      var minY = 44; // keep clear of the demonstration marker at the top
      popup.style.left = (pad + Math.random() * (maxX - pad)) + "px";
      popup.style.top = (minY + Math.random() * (maxY - minY)) + "px";
    }

    // Show after 0.5s, like the site's own News popup. (The delay does not let us
    // read the frame's colour: cross-origin reads are blocked regardless of timing.)
    setTimeout(function () {
      popup.hidden = false;
      place();
    }, 500);
    window.addEventListener("resize", function () { if (!popup.hidden) place(); });

    function go() { window.location.href = YT; }
    document.getElementById("subBtn").addEventListener("click", go);
    document.getElementById("iconBtn").addEventListener("click", go);
  </script>
</body>
</html>
